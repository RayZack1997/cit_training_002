<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取物顺序可视化</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            max-height: 70%;
            overflow-y: auto;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>路径列表</h2>
        <div id="path-list"></div>
        <div id="path-actions" style="margin:8px 0;">
            <button id="btn-delete-selected">删除选中</button>
            <button id="btn-clear-all">一键清空</button>
        </div>
        <hr>
        <h3>轨迹点列表</h3>
        <div id="waypoint-list"></div>
        <hr>
        <h3>导入新路径</h3>
        <form id="upload-form" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:5px;">
            <input type="file" name="file" accept=".txt" required>
            <button type="submit">上传</button>
        </form>
    </div>
    <div id="map"></div>

    <!-- 弹出模态框 -->
    <div id="waypoint-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="modal-close">&times;</span>
            <h3 id="modal-title">轨迹点列表</h3>
            <div id="modal-waypoint-list"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 自定义 JS -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/map.js"></script>
</body>
</html>
