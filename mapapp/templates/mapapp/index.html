<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取物顺序可视化</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="sidebar">
        <h2>路径列表</h2>
        <!-- 筛选区 -->
        <div id="filter-area" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;">
            <input type="text" id="filter-person" placeholder="人物" style="width:80px;">
            <input type="text" id="filter-item" placeholder="物品" style="width:80px;">
            <input type="date" id="filter-date-from" style="width:120px;">
            <input type="date" id="filter-date-to" style="width:120px;">
            <button id="btn-filter">筛选</button>
            <button id="btn-clear-filter">重置</button>
        </div>
        <hr>
        <div id="path-list"></div>
        <div id="path-actions" style="margin:8px 0;">
            <button id="btn-delete-selected">删除选中</button>
            <button id="btn-clear-all">一键清空</button>
        </div>
        <hr>
        <h3>轨迹点列表</h3>
        <div id="waypoint-list"></div>
        <hr>
        <h3>导入新路径</h3>
        <form id="upload-form" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:5px;">
            <input type="file" name="file" accept=".txt" required>
            <input type="text" name="person_name" placeholder="人物名称">
            <input type="date" name="pickup_date">
            <input type="text" name="items" placeholder="物品名称，逗号分隔">
            <button type="submit">上传</button>
        </form>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 自定义 JS -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/map.js"></script>
</body>
</html>
